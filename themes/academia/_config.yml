favicon: /img/favicon.png
# Change to your profile picture
avatar: /img/profile.png
# if author sets in hexo_config, this string doesn't work
author: 'Wenbo Ding'
author_bio: 'Lead of AD Model Team @ SAIC AI Lab | Kaggle Master | Dr. Eng.'

since: 2020

# Top Menu 顶部菜单
# #title 为页内跳转，单页模式
# 可以选择外链或其他页面
menu:
  About: /
  # Publications: /#Publications
  # Blog: https://phower.me

# flink picture will load if avator link calls on error
loading_bg:
  flink: /img/profile.png

# Social Links; 社交链接，不需要的链接直接注释掉
# 可以调整显示顺序
# 图标调用 font-awesome 4.7
social:
  enable: true
social_links:
  fab fa-github: https://github.com/dingwoai
  # fab fa-twitter: /
  # fab fa-linkedin: /
  # fab fa-stack-overflow: /
  # fas fa-envelope: /
  # fas fa-rss: /

# Additional social_links，额外添加自定义链接，可显示链接名称
# name: url || icon_name
e_social:
  enable: true
e_social_links:
  Google Scholar: https://scholar.google.com/citations?user=hFkcq3IAAAAJ || fas fa-graduation-cap

# CV download link
cv_dl:
  enable: false
  dir: /attaches/CV.pdf
  description: Download CV

# Box-shadow
# display box-shadow on page or not
box_shadow:
  enable: true

# CDN
# 根据需要自行添加js/css
# 自定义css可以直接写在user.styl中
CDN_USE:
  css:
    - /css/index.css
    - https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.0/css/all.min.css # fontawesome 5
    - https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css # AOS scroll animations
  js:
    - https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js
    - https://cdn.jsdelivr.net/npm/jquery-pjax@latest/jquery.pjax.min.js
    - https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js # AOS scroll animations
    - /js/main.js
